# =============================================================================
# pipeline-api configuration.
#
# Every environment-specific value below can be overridden WITHOUT rebuilding
# the JAR, via the environment variable named in ${VAR:default}. This is what
# makes the same JAR deployable on any server:
#
#   SERVER_PORT             HTTP port to listen on                 (default 8088)
#   DB_URL                  JDBC URL of the PostGIS database
#   DB_USERNAME / DB_PASSWORD   database credentials
#   PIPELINE_PROJECT_ROOT   absolute path to the repo root that holds
#                           pipeline_v2/output/ (tiles + road OBJ source data)
#   CORS_ALLOWED_ORIGINS    comma-separated origin patterns allowed to call the
#                           API; "*" (default) = any front-end, anywhere
#
# Example (Linux):
#   SERVER_PORT=8088 \
#   DB_URL='jdbc:postgresql://db-host:5432/pipeline_v2?stringtype=unspecified' \
#   DB_USERNAME=postgres DB_PASSWORD=secret \
#   PIPELINE_PROJECT_ROOT=/opt/pipeline \
#   CORS_ALLOWED_ORIGINS='*' \
#   java -jar pipeline-api.jar
# =============================================================================

server:
  port: ${SERVER_PORT:8088}
  # Bind to all interfaces by default so remote clients can reach the JAR.
  # Set SERVER_ADDRESS=127.0.0.1 to restrict to loopback.
  address: ${SERVER_ADDRESS:0.0.0.0}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: pipeline-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pipeline_v2?stringtype=unspecified}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.pipeline.api.dto
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100

logging:
  level:
    com.pipeline.api.mapper: ${LOG_LEVEL_SQL:DEBUG}

pipeline:
  # Path to the repo root. `java -jar` from pipeline_v2/api/ puts the project
  # root at ../.. (the default). On a server, point PIPELINE_PROJECT_ROOT at the
  # absolute directory that contains pipeline_v2/output/.
  project-root: ${PIPELINE_PROJECT_ROOT:../..}
  cors:
    # Comma-separated origin patterns permitted to call /api/** and
    # /scene-tiles/**. "*" allows any remote front-end (the default, so the
    # deployed JAR is usable out of the box). Lock down in production, e.g.
    #   CORS_ALLOWED_ORIGINS=https://gis.example.com,http://10.0.0.5:*
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
